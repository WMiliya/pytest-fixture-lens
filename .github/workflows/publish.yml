name: Publish to PyPI

# Publishes when you publish a GitHub Release, or manually from the Actions tab.
# Uses PyPI Trusted Publishing (OIDC): no API token or password is stored anywhere.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install tooling
        run: python -m pip install -e ".[dev]" build twine

      - name: Lint and test
        run: |
          ruff check .
          ruff format --check .
          pytest

      - name: Build sdist and wheel
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Smoke test the built wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -m pytest examples/demo_project/tests \
            --fixture-lens --fixture-lens-dir /tmp/lens-smoke
          test -f /tmp/lens-smoke/report.html

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/pytest-fixture-lens
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
