name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest
      - name: Demo smoke test
        run: pytest examples/demo_project/tests --fixture-lens --fixture-lens-dir examples/demo_project
      - name: Upload demo report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: fixturelens-demo-report
          path: |
            examples/demo_project/report.html
            examples/demo_project/report.json
