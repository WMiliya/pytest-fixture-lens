[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-fixture-lens"
version = "0.1.0"
description = "See which pytest fixtures your tests build, reuse, and pay for — as an offline HTML report."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FixtureLens contributors" }]
keywords = ["pytest", "fixtures", "testing", "performance", "report", "plugin"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=8,<10"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/WMiliya/pytest-fixture-lens"
Documentation = "https://github.com/WMiliya/pytest-fixture-lens/tree/main/docs"
Changelog = "https://github.com/WMiliya/pytest-fixture-lens/blob/main/CHANGELOG.md"
Issues = "https://github.com/WMiliya/pytest-fixture-lens/issues"

[project.entry-points.pytest11]
fixturelens = "fixturelens.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fixturelens = ["templates/*.html", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
